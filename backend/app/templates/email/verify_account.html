{% extends "base.html" %}
{% block content %}
<h2>Bienvenue {{ name }} 👋</h2>
<p>Confirmez votre adresse e-mail pour activer votre compte TouriBook.</p>
<p style="text-align:center;margin:32px 0;">
  <a href="{{ link }}" style="background:#0f766e;color:#fff;padding:14px 28px;border-radius:8px;text-decoration:none;">
    Confirmer mon compte
  </a>
</p>
<p style="font-size:13px;color:#666;">Ce lien expire dans {{ hours }} heures.</p>
<p style="font-size:12px;word-break:break-all;color:#999;">{{ link }}</p>
{% endblock %}
