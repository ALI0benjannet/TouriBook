{% extends "base.html" %}
{% block content %}
<h2>Bonjour {{ name }} 👋</h2>
<p>Réinitialisez votre mot de passe pour votre compte TouriBook.</p>
<p style="text-align:center;margin:32px 0;">
  <a href="{{ link }}" style="background:#0f766e;color:#fff;padding:14px 28px;border-radius:8px;text-decoration:none;">
    Réinitialiser mon mot de passe
  </a>
</p>
<p style="font-size:13px;color:#666;">Ce lien expire dans {{ minutes }} minutes.</p>
<p style="font-size:12px;word-break:break-all;color:#999;">{{ link }}</p>
{% endblock %}
